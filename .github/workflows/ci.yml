name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.4'
                      symfony: '6.4.*'
                      tui: false
                    - php: '8.4'
                      symfony: '7.4.*'
                      tui: false
                    - php: '8.4'
                      symfony: '8.0.*'
                      tui: false
                    - php: '8.4'
                      symfony: '8.1.*'
                      tui: true
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: zlib, pdo_mysql
                  tools: composer:v2, flex
                  coverage: none

            - name: Drop symfony/tui, which needs Symfony 8.1
              if: ${{ !matrix.tui }}
              run: composer remove --dev symfony/tui --no-update

            - name: Install dependencies
              env:
                  SYMFONY_REQUIRE: ${{ matrix.symfony }}
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Run tests
              run: make test

    mysql:
        name: Restore against MariaDB
        runs-on: ubuntu-latest
        services:
            database:
                image: mariadb:11.8
                env:
                    MARIADB_ROOT_PASSWORD: root
                    MARIADB_DATABASE: dump_loader_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mariadb -uroot -proot -e 'SELECT 1'"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: zlib, pdo_mysql
                  tools: composer:v2, flex
                  coverage: none

            - name: Install the MariaDB client
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mariadb-client

            - name: Drop symfony/tui, which needs Symfony 8.1
              run: composer remove --dev symfony/tui --no-update

            - name: Install dependencies
              env:
                  SYMFONY_REQUIRE: '7.4.*'
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Restore a real dump
              env:
                  DUMP_LOADER_TEST_DSN: mysql://root:root@127.0.0.1:3306/dump_loader_test
                  DUMP_LOADER_TEST_MYSQL_BINARY: mariadb
              run: make test-mysql

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: zlib, pdo_mysql
                  tools: composer:v2, flex
                  coverage: xdebug

            - name: Install dependencies
              env:
                  SYMFONY_REQUIRE: '8.1.*'
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Run tests with coverage
              env:
                  XDEBUG_MODE: coverage
              run: make coverage-clover

            - name: Require 100% coverage
              run: |
                  php -r '
                      $xml = new SimpleXMLElement(file_get_contents("clover.xml"));
                      $metrics = $xml->project->metrics;
                      $statements = (int) $metrics["statements"];
                      $covered = (int) $metrics["coveredstatements"];
                      $percent = 0 === $statements ? 0.0 : $covered / $statements * 100;
                      printf("Coverage: %.2f%% (%d/%d statements)%s", $percent, $covered, $statements, PHP_EOL);
                      exit($covered === $statements && $statements > 0 ? 0 : 1);
                  '
